<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .form-container {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    .form-container h2 {
      color: #fff;
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.8rem;
    }

    .form-container p.subtitle {
      color: rgba(255, 255, 255, 0.6);
      text-align: center;
      margin-bottom: 30px;
      font-size: 0.9rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 6px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      outline: none;
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #7c5cfc;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.2);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-row {
      display: flex;
      gap: 16px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #7c5cfc, #a855f7);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(124, 92, 252, 0.4);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .btn-submit .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }

    .btn-submit.loading .btn-text { display: none; }
    .btn-submit.loading .spinner { display: inline-block; }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Toast notification */
    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 14px 24px;
      border-radius: 8px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 9999;
      transform: translateX(120%);
      transition: transform 0.4s ease;
      max-width: 360px;
    }

    .toast.show { transform: translateX(0); }

    .toast.success {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .toast.error {
      background: linear-gradient(135deg, #ef4444, #dc2626);
    }

    @media (max-width: 500px) {
      .form-container { padding: 24px; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

  <!-- Toast -->
  <div id="toast" class="toast"></div>

  <div class="form-container">
    <h2>Hubungi Kami</h2>
    <p class="subtitle">Kirim pesan dan kami akan membalas melalui Telegram</p>

    <form id="contactForm">
      <div class="form-row">
        <div class="form-group">
          <label for="nama">Nama</label>
          <input type="text" id="nama" name="nama" placeholder="Nama lengkap" required>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="email@contoh.com" required>
        </div>
      </div>

      <div class="form-group">
        <label for="subject">Subjek</label>
          <input type="text" id="org" name="org" placeholder="Nama event / instansi">
        </div>

        <div class="form-group">
          <label for="phone">No. WhatsApp</label>
          <input type="tel" id="phone" name="phone" placeholder="+62 ..." required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="date">Tanggal Event</label>
            <input type="date" id="date" name="date">
          </div>
          <div class="form-group">
            <label for="type">Jenis Acara</label>
            <input type="text" id="type" name="type" placeholder="Festival, private gig, dll.">
          </div>
      </div>

      <div class="form-group">
          <label for="message">Pesan</label>
          <textarea id="message" name="message" placeholder="Tulis pesan Anda di sini..." required></textarea>
      </div>

      <button type="submit" class="btn-submit" id="btnSubmit">
        <span class="btn-text">Kirim Pesan</span>
        <span class="spinner"></span>
      </button>
    </form>
  </div>

  <script>
    // ═══════════════════════════════════════════════════════════
    //  GANTI URL INI DENGAN URL GOOGLE APPS SCRIPT ANDA
    // ═══════════════════════════════════════════════════════════
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzCeaAegcKA6VOYb3MCiGLVraxGs0p6IBOlLpY3VevoOG48ONmVnpoLBX4LLcae9wM/exec';

    const form      = document.getElementById('contactForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const toast     = document.getElementById('toast');

    // ── Toast helper ──────────────────────────────────────────
    function showToast(message, type = 'success') {
      toast.textContent = message;
      toast.className   = 'toast ' + type + ' show';
      setTimeout(() => { toast.classList.remove('show'); }, 4000);
    }

    // ── Submit handler ────────────────────────────────────────
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      // Ambil data dari form
      const data = {
        name:    form.nama.value.trim(),
        org:     form.org.value.trim(),
        email:   form.email.value.trim(),
        phone:   form.phone.value.trim(),
        date:    form.date.value,
        type:    form.type.value.trim(),
        message: form.message.value.trim()
      };

      // Validasi client-side
      if (!data.name || !data.email || !data.phone || !data.message) {
        showToast('Mohon lengkapi semua field yang wajib diisi.', 'error');
        return;
      }

      // UI: loading state
      btnSubmit.classList.add('loading');
      btnSubmit.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',   // Google Apps Script memerlukan no-cors
          body: new URLSearchParams(data)
        });

        // Karena mode no-cors, kita tidak bisa baca response body.
        // Jika tidak ada error yang di-lempar, anggap berhasil.
        showToast('Pesan berhasil dikirim!', 'success');
        form.reset();

      } catch (err) {
        showToast('Gagal mengirim pesan. Coba lagi nanti.', 'error');
        console.error('Error:', err);

      } finally {
        btnSubmit.classList.remove('loading');
        btnSubmit.disabled = false;
      }
    });
  </script>
</body>
</html>
